name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==================== Backend Tests ====================
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run backend tests
        # tests/ holds the gateway, payment and auth regression suites; both folders run
        env:
          USE_FAKE_REDIS: "true"
          JWT_SECRET: "test-secret-key"
          OPENAI_API_KEYS: "sk-test"
          ADMIN_EMAIL: "admin@ci.local"
          ADMIN_PASSWORD: "ci-admin-password"
          DATABASE_URL: "sqlite:///./ci.db"
          REDIS_URL: "redis://localhost:6379/0"
        run: python -m pytest tests backend/tests --ignore=backend/tests/load_test.py -v --tb=short

  # ==================== Frontend Build ====================
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # ==================== Docker Build ====================
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Verify containers start
        env:
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: ci-admin-password
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker compose down

services:
  - type: web
    name: api-on-rent-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    # --proxy-headers: behind Render's proxy request.client is the proxy; this makes it the real
    # client IP, which rate limiting and key IP-pinning depend on
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_URL
        sync: false   # e.g. https://api-on-rent-backend.onrender.com
      - key: FRONTEND_URL
        sync: false   # e.g. https://your-project.pages.dev
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_ENVIRONMENT
        value: production
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      # Render blocks outbound SMTP, so use the Gmail API (HTTPS) there
      - key: EMAIL_TRANSPORT
        value: gmail_api
      - key: GMAIL_API_CLIENT_ID
        sync: false
      - key: GMAIL_API_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: USE_FAKE_REDIS
        value: "false"
